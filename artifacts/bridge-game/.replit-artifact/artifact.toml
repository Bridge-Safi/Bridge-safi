kind = "web"
previewPath = "/bridge-game/"
title = "Bridge Game"
version = "1.0.0"
id = "artifacts/bridge-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/bridge-game/", "/bridge-game" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bridge-game", "run", "build" ]
publicDir = "artifacts/bridge-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8080"
BASE_PATH = "/bridge-game/"
