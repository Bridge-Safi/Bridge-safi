<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a"/>
  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="110" fill="url(#bg_grad)" opacity="0.6"/>

  <!-- Bridge arch (centered, big) -->
  <!-- Left pillar -->
  <rect x="100" y="240" width="48" height="180" rx="10" fill="#10b981"/>
  <!-- Right pillar -->
  <rect x="364" y="240" width="48" height="180" rx="10" fill="#10b981"/>
  <!-- Arch path -->
  <path d="M148 275 Q256 80 364 275" stroke="#10b981" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Road deck -->
  <rect x="72" y="408" width="368" height="22" rx="11" fill="#34d399"/>
  <!-- Suspension cables left -->
  <line x1="256" y1="108" x2="148" y2="408" stroke="#6ee7b7" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- Suspension cables right -->
  <line x1="256" y1="108" x2="364" y2="408" stroke="#6ee7b7" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- Inner cable left -->
  <line x1="196" y1="188" x2="196" y2="408" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- Inner cable right -->
  <line x1="316" y1="188" x2="316" y2="408" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- BT monogram top-right accent dot -->
  <circle cx="412" cy="108" r="18" fill="#10b981"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
